;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32
lib_dir = lib_disabled

[common_settings]
build_flags = 
    -I include

[release_settings]
build_flags = 
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO

[dev_settings]
build_flags = 
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
    
[test_settings]
build_flags = 
    -D LOG_LOCAL_LEVEL=ESP_LOG_ERROR

[test_info_settings]
build_flags =
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO


[env]

[env:esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32
build_flags = 
    ${common_settings.build_flags}
    ${release_settings.build_flags}
monitor_speed = 115200 
monitor_raw = yes

[env:esp32_test]
extends = env:esp32
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32_test
build_flags = 
    ${common_settings.build_flags}
    ${test_settings.build_flags}
monitor_raw = no
monitor_speed = 115200 
monitor_filters = esp32_exception_decoder
test_speed = 115200
test_build_src = yes
lib_ldf_mode = chain+
test_filter = 
    embedded/*

[env:esp32_test_stepper]
extends = env:esp32_test
build_flags =
    ${env:esp32_test.build_flags}
    -D SERVO=0
    -D STEPPER=1
    -D BDC=0
test_ignore =
    embedded/drivers/test_servo_driver
    embedded/protocol/test_web_command_ingest_servo

[env:esp32_test_servo]
extends = env:esp32_test
build_flags =
    ${env:esp32_test.build_flags}
    -D SERVO=1
    -D STEPPER=0
    -D BDC=0
test_ignore =
    embedded/drivers/test_pulse_engine_gptimer_rate
    embedded/drivers/test_pulse_engine_rate
    embedded/drivers/test_pulse_engine_rmt_abort_restart
    embedded/drivers/test_pulse_engine_rmt_rate
    embedded/drivers/test_pulse_engine_rmt_signal_validation
    embedded/drivers/test_pulse_engine_rmt_single_slot_fallback
    embedded/drivers/test_stepper_driver
    embedded/drivers/test_stepper_motion_plan
    embedded/protocol/test_web_command_ingest_stepper

[env:esp32_test_info]
extends = env:esp32_test
build_flags =
    ${common_settings.build_flags}
    ${test_info_settings.build_flags}

[env:esp32_test_info_stepper]
extends = env:esp32_test_info
build_flags =
    ${env:esp32_test_info.build_flags}
    -D SERVO=0
    -D STEPPER=1
    -D BDC=0
test_ignore =
    embedded/drivers/test_servo_driver
    embedded/protocol/test_web_command_ingest_servo

[env:esp32_test_info_servo]
extends = env:esp32_test_info
build_flags =
    ${env:esp32_test_info.build_flags}
    -D SERVO=1
    -D STEPPER=0
    -D BDC=0
test_ignore =
    embedded/drivers/test_pulse_engine_gptimer_rate
    embedded/drivers/test_pulse_engine_rate
    embedded/drivers/test_pulse_engine_rmt_abort_restart
    embedded/drivers/test_pulse_engine_rmt_rate
    embedded/drivers/test_pulse_engine_rmt_signal_validation
    embedded/drivers/test_pulse_engine_rmt_single_slot_fallback
    embedded/drivers/test_stepper_driver
    embedded/drivers/test_stepper_motion_plan
    embedded/protocol/test_web_command_ingest_stepper

[env:esp32_clean_flash]
extends = env:esp32
targets =
    erase
    uploadfs
    upload

[env:native]
platform = native
test_framework = unity
build_flags =
    ${common_settings.build_flags}
test_build_src = no
test_filter =
    native/*

[env:native_coverage]
extends = env:native
build_flags =
    ${common_settings.build_flags}
    -O0
    -g
    --coverage
    -lgcov
build_unflags =
    -Os
test_filter =
    native/*
