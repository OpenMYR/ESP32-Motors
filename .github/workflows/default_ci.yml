# .github/workflows/default_ci.yml
name: Default_CI

on:
  pull_request:
    branches: [ master, dev ]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/**"

  push:
    branches: [ master, dev ]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/**"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke_linux:
    name: Smoke Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip + PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio
          key: ubuntu-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ubuntu-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Smoke compile
        run: |
          platformio run -e esp32

  ESP32_COM_CI:
    name: ESP32_COM_CI
    runs-on: esp32-com
    needs: [smoke_linux]
    if: ${{ needs.smoke_linux.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip + PlatformIO (self-hosted)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio
          key: esp32com-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            esp32com-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Unit test smoke (esp32_test)
        run: |
          set -e
          pio test -e esp32_test -f embedded/test_demo
          pio test -e esp32_test -f embedded/drivers/test_servo_driver
          pio test -e esp32_test -f embedded/drivers/test_stepper_driver

      - name: Unit tests (native)
        run: |
          set -e
          pio test -e native

      - name: Full unit test run (esp32_test)
        run: |
          set -e
          pio test -e esp32_test