# .github/workflows/default_ci.yml
name: Default_CI

on:
  pull_request:
    branches: [ master, dev ]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/**"

  push:
    branches: [ master, dev ]
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/**"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke_linux:
    name: Smoke Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-py3.12-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-py3.12-

      - name: Install PlatformIO + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio intelhex

      - name: Smoke compile
        run: |
          platformio run -e esp32

  ESP32_COM_CI:
    name: ESP32_COM_CI
    runs-on: esp32-com
    needs: [smoke_linux]
    if: ${{ needs.smoke_linux.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache pip (self-hosted)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py-${{ hashFiles('.github/workflows/default_ci.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py-

      - name: Cache PlatformIO (self-hosted)
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO + deps (system python)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade platformio intelhex

      - name: Unit test smoke (embedded)
        run: |
          set -e
          pio test -e esp32_test -f embedded/test_demo
          pio test -e esp32_test_servo -f embedded/drivers/test_servo_driver
          pio test -e esp32_test_stepper -f embedded/drivers/test_stepper_driver

#      - name: Unit tests (native)
#        run: |
#          set -e
#          pio test -e native

      - name: Full unit test run (embedded)
        run: |
          set -e
          pio test -e esp32_test_stepper
          pio test -e esp32_test_servo
